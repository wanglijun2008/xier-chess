<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>西尔象棋盲棋（公开免费版）</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 围棋听棋入口 -->
        <div id="nav-bar" style="padding: 12px; text-align: center; background: #1a1a1a; border-bottom: 2px solid #ffeb3b;">
            <a href="blind-go.html" style="color: #ffeb3b; font-size: 1.2rem; font-weight: bold; text-decoration: underline;" aria-label="进入围棋听棋公开免费版，本页面与下方象棋相互独立">进入围棋听棋（公开免费版）</a>
            <div style="color: #ccc; font-size: 0.9rem; margin-top: 4px;">围棋与下方象棋是两个独立页面，可分别使用</div>
        </div>
        <!-- 状态栏 -->
        <div id="status-bar" aria-live="polite">
            <span id="turn-info">红方走棋</span>
            <span id="round-info">第 1 回合</span>
            <span style="color: #ffeb3b; font-weight: bold;">（公开免费共享）</span>
        </div>

        <!-- 可见消息区域（语音失效时也能看到提示） -->
        <div id="message-bar" role="status" aria-live="polite"></div>

        <!-- 棋盘区域 -->
        <div id="board-container">
            <canvas id="board" role="img" aria-label="象棋棋盘，点击棋子选中后滑动走棋"></canvas>
            <div id="list-container" style="display: none;"></div>
        </div>

        <!-- 文字输入走棋（华为浏览器等不支持语音时使用） -->
        <div id="input-bar">
            <input type="text" id="move-input" placeholder="输入棋谱，如炮2平5或炮二平五" autocomplete="off" aria-label="棋谱输入框">
            <button id="btn-send" aria-label="发送棋谱">走棋</button>
        </div>

        <!-- 工具栏 -->
        <div id="toolbar">
            <button class="tool-btn" id="btn-new" aria-label="新局">
                <span class="icon"></span>
                <span class="label">新局</span>
            </button>
            <button class="tool-btn" id="btn-undo" aria-label="悔棋">
                <span class="icon">↶</span>
                <span class="label">悔棋</span>
            </button>
            <button class="tool-btn" id="btn-speak" aria-label="播报局面">
                <span class="icon">🔊</span>
                <span class="label">播报</span>
            </button>
            <button class="tool-btn" id="btn-repeat" aria-label="重复播报">
                <span class="icon">🔁</span>
                <span class="label">重复</span>
            </button>
            <button class="tool-btn" id="btn-mode" aria-label="切换模式">
                <span class="icon">⚔</span>
                <span class="label">双人</span>
            </button>
            <button class="tool-btn" id="btn-voice" aria-label="语音指令">
                <span class="icon">🎤</span>
                <span class="label">语音</span>
            </button>
            <button class="tool-btn" id="btn-list" aria-label="列表模式">
                <span class="icon">☰</span>
                <span class="label">列表</span>
            </button>
            <button class="tool-btn" id="btn-help" aria-label="帮助">
                <span class="icon">?</span>
                <span class="label">帮助</span>
            </button>
        </div>
    </div>

    <script src="chess.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
