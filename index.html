<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>西尔象棋盲棋</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=20260921b">
</head>
<body>
    <div id="app">
        <!-- 状态栏 -->
        <div id="status-bar" aria-live="polite">
            <span id="turn-info">红方走棋</span>
            <span id="round-info">第 1 回合</span>
        </div>

        <!-- 可见消息区域（语音失效时也能看到提示） -->
        <div id="message-bar" role="status" aria-live="polite"></div>

        <!-- 棋盘区域 -->
        <div id="board-container">
            <canvas id="board" role="img" aria-label="象棋棋盘，点击棋子选中后滑动走棋"></canvas>
            <div id="list-container" style="display: none;"></div>
        </div>

        <!-- 文字输入走棋（华为浏览器等不支持语音时使用） -->
        <div id="input-bar">
            <input type="text" id="move-input" placeholder="输入棋谱，如炮2平5或炮二平五" autocomplete="off" aria-label="棋谱输入框">
            <button id="btn-send" aria-label="发送棋谱">走棋</button>
        </div>

        <!-- 工具栏 -->
        <div id="toolbar">
            <button class="tool-btn" id="btn-new" aria-label="新局">
                <span class="icon"></span>
                <span class="label">新局</span>
            </button>
            <button class="tool-btn" id="btn-undo" aria-label="悔棋">
                <span class="icon">↶</span>
                <span class="label">悔棋</span>
            </button>
            <button class="tool-btn" id="btn-speak" aria-label="播报局面">
                <span class="icon">🔊</span>
                <span class="label">播报</span>
            </button>
            <button class="tool-btn" id="btn-repeat" aria-label="重复播报">
                <span class="icon">🔁</span>
                <span class="label">重复</span>
            </button>
            <button class="tool-btn" id="btn-mode" aria-label="切换模式">
                <span class="icon">⚔</span>
                <span class="label">双人</span>
            </button>
            <button class="tool-btn" id="btn-voice" aria-label="语音指令">
                <span class="icon">🎤</span>
                <span class="label">语音</span>
            </button>
            <button class="tool-btn" id="btn-list" aria-label="列表模式">
                <span class="icon">☰</span>
                <span class="label">列表</span>
            </button>
            <button class="tool-btn" id="btn-record" aria-label="棋谱回放">
                <span class="icon">📜</span>
                <span class="label">棋谱</span>
            </button>
            <button class="tool-btn" id="btn-help" aria-label="帮助">
                <span class="icon">?</span>
                <span class="label">帮助</span>
            </button>
        </div>
    </div>

    <!-- 棋谱回放模态框 -->
    <div id="record-modal" style="display:none;">
        <div id="record-modal-content">
            <div id="record-modal-header">
                <span>棋谱回放</span>
                <button id="record-close" aria-label="关闭">✕</button>
            </div>
            <div id="record-input-area">
                <textarea id="record-text" placeholder="粘贴棋谱，每行一步，如：&#10;炮2平5&#10;马8进7&#10;车一平二&#10;&#10;支持格式：炮2平5、炮二平五、前车2进3&#10;双方各以自己右下角为基准" aria-label="棋谱文本"></textarea>
                <button id="record-parse" aria-label="解析棋谱">解析棋谱</button>
            </div>
            <div id="record-info" style="display:none;"></div>
            <div id="record-controls" style="display:none;">
                <div id="record-progress">
                    <span id="record-step-info">第 0 / 0 步</span>
                </div>
                <div id="record-buttons">
                    <button id="record-prev" aria-label="上一步">◀上步</button>
                    <button id="record-play" aria-label="播放">▶播放</button>
                    <button id="record-next" aria-label="下一步">下步▶</button>
                </div>
                <div id="record-speed">
                    <span>慢</span>
                    <input type="range" id="record-speed-range" min="500" max="5000" step="500" value="2000" aria-label="播放速度">
                    <span>快</span>
                </div>
            </div>
        </div>
    </div>

    <script src="chess.js?v=20260921b"></script>
    <script src="record-player.js?v=20260921b"></script>
    <script src="app.js?v=20260921b"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js?v=20260921b').then(function(reg) {
                // 检测到新版本时立即刷新
                if (reg.waiting) reg.waiting.postMessage({type: 'SKIP_WAITING'});
            });
            // 新 SW 接管后立即刷新页面
            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
